schema: spec-driven

context: |
  Artefacts rédigés en français.
  Cible de déploiement imposée : cluster Kubernetes OVH `catwo`, namespace `quick-cooking`,
  URL https://quick-cooking.lo2k.net (TLS par Cloudflare, ingress-nginx classe `nginx`).
  L'application est livrée en UNE image Docker `xblaster/quick-cooking:<AAAAMMJJ-sha7>` (linux/amd64),
  HTTP sur le port 80, répond 200 sur GET /, sans état par défaut, 2 réplicas, max 256 Mi / 0,2 CPU.
  Contrat complet, build, déploiement et rollback : AGENTS.md et docs/deploiement.md.
  Toute persistance (PVC RWO, reclaim Delete) ou base de données doit être décidée dans la proposition.
  Aucun secret dans le dépôt ; LLM gratuits uniquement.

rules:
  tasks:
    - Inclure les tâches de build de l'image et de mise à jour de deploy/k8s/ quand le changement touche le runtime.
    - Le déploiement réel sur le cluster est une tâche distincte, à valider par un humain.

