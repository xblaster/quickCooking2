# Construit et publie l'image Docker Hub à chaque push sur main, puis déploie si activé.
# Secrets GitHub requis : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (token d'accès Docker Hub, pas le mot de passe).
# Déploiement automatique (optionnel) : variable DEPLOY_ENABLED=true + secret KUBECONFIG_QUICK_COOKING
# (kubeconfig restreint au namespace, voir deploy/k8s/optionnel/ci-rbac.yaml).
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag versionné
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            xblaster/quick-cooking:${{ steps.tag.outputs.tag }}
            xblaster/quick-cooking:latest

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Kubeconfig restreint
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_QUICK_COOKING }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Déployer le tag daté
        run: |
          kubectl -n quick-cooking set image deploy/quick-cooking \
            quick-cooking=xblaster/quick-cooking:${{ needs.build.outputs.tag }}
          if ! kubectl -n quick-cooking rollout status deploy/quick-cooking --timeout=180s; then
            echo "Rollout en échec : retour à la version précédente"
            kubectl -n quick-cooking rollout undo deploy/quick-cooking
            exit 1
          fi
