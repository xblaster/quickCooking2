# Entrée publique : Cloudflare (TLS) -> ingress-nginx 146.59.242.169 -> Service.
# ssl-redirect reste à "false" : Cloudflare termine le TLS, une redirection ici bouclerait.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quick-cooking-ingress
  namespace: quick-cooking
  labels:
    app.kubernetes.io/name: quick-cooking
    app.kubernetes.io/part-of: quick-cooking-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    # Protection auth.lo2k.net (change adopter-auth-lo2k) : posée par scripts/auth/proteger.py de lo2k_infrastructure.
    # /api/export est exempté par quick-cooking-machine (ingress-machine.yaml).
    nginx.ingress.kubernetes.io/auth-url: "http://auth-svc.auth.svc.cluster.local/verifier?site=quick-cooking"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.lo2k.net/connexion?rd=https://$host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Personne,X-Auth-Appareil,X-Auth-Admin"
    nginx.ingress.kubernetes.io/auth-cache-key: "$cookie_lo2k_auth$host"
    nginx.ingress.kubernetes.io/auth-cache-duration: "200 30s"
spec:
  ingressClassName: nginx
  rules:
    - host: quick-cooking.lo2k.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quick-cooking-service
                port:
                  number: 80
